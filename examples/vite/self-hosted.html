<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The README's policy for self-hosted assets: no blob: workers, everything from this origin. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; style-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pdf-sdk editor with self-hosted assets</title>
  </head>
  <body data-assets="self-hosted">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
