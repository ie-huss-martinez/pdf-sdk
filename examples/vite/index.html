<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The README's policy for inlined assets: workers from blob: URLs, and WebAssembly. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src blob:; style-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pdf-sdk editor with inlined assets</title>
  </head>
  <body data-assets="inline">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
